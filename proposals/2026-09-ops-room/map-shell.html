<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wodore · Karten-Shell · Design-Vorschlag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Alpine Ops Room proposal · wodore-design/DESIGN.md ─────────────── */
  :root {
    --night-pine: #0a140f;
    --pine-panel: #112119;
    --pine-deep: #0e1b14;
    --pine-ridge: #1c3629;
    --forest: #346751;
    --forest-deep: #224e3b;
    --turquoise: #9dd9d2;
    --turquoise-muted: #6dc59f;
    --ice-mint: #a9f0d2;
    --gold: #bfab25;
    --paper: #f2f7f4;
    --signal: #25c15e;
    --restricted: #debd3a;
    --closed: #bf211e;
    --r-base: 6px;
    --label: 500 0.7rem/1 'Roboto Condensed', Roboto, sans-serif;
    --label-track: 0.14em;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scrollbar-color: rgba(153,128,25,.5) var(--pine-deep); }
  body {
    font: 400 15px/1.5 'Roboto', -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--paper); background: var(--night-pine); height: 100vh; overflow: hidden;
  }
  ::selection { background: rgba(157,217,210,.28); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--turquoise); outline-offset: 2px; border-radius: 4px; }
  .icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .map { position: fixed; inset: 0; background: url('assets/map-backdrop.jpg') center / cover no-repeat; }
  .map::after { content: ''; position: absolute; inset: 0; background: rgba(10,20,15,.38); }

  /* floating map label: the halo signature */
  .map-label {
    position: absolute; left: 58%; top: 38%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: rgba(14,27,20,.92); border-radius: var(--r-base);
    font-family: 'Roboto Condensed', Roboto, sans-serif;
    text-shadow: 0 0 4px rgba(19,52,38,.7);
  }
  .map-label .pin { width: 12px; height: 12px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--signal); box-shadow: 0 0 4px rgba(19,52,38,.8); }
  .map-label strong { font-weight: 500; }
  .map-label .beds { color: #6ee3b0; font-variant-numeric: tabular-nums; }

  /* ── top bar ─────────────────────────────────────────────────────────── */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: rgba(10,20,15,.88);
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo img { height: 30px; width: auto; display: block; }

  .search-wrap { position: relative; flex: 1; max-width: 460px; margin-left: auto; margin-right: auto; }
  .search {
    display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px;
    background: var(--pine-panel); border-radius: var(--r-base);
  }
  .search .icon { color: var(--turquoise-muted); }
  .search input {
    flex: 1; background: none; border: 0; color: var(--paper);
    font: 400 .95rem 'Roboto', sans-serif; caret-color: var(--turquoise); min-width: 0;
  }
  .search input::placeholder { color: var(--turquoise-muted); }
  .search kbd {
    font: var(--label); letter-spacing: .06em; color: var(--turquoise-muted);
    background: var(--pine-deep); border-radius: 4px; padding: 4px 7px;
  }
  .date-chip {
    display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px;
    background: var(--pine-panel); border-radius: var(--r-base);
    font: 500 .8rem/1 'Roboto Condensed', Roboto, sans-serif; letter-spacing: .1em;
    color: var(--paper); font-variant-numeric: tabular-nums;
  }
  .date-chip .icon { width: 17px; height: 17px; color: var(--turquoise-muted); }
  .date-chip:hover { background: var(--pine-ridge); }

  /* search results: open state shown */
  .results {
    position: absolute; top: 52px; left: 0; right: 0; overflow: hidden;
    background: var(--pine-panel); border-radius: var(--r-base);
  }
  .result {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 14px; border-bottom: 1px solid var(--pine-ridge);
  }
  .result:last-child { border-bottom: 0; }
  .result .pin { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); flex: none; }
  .result .name { font: 500 1rem/1.2 'Roboto Condensed', Roboto, sans-serif; }
  .result .meta { font-size: .8rem; color: var(--turquoise-muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .result .beds { margin-left: auto; font: var(--label); letter-spacing: .08em; white-space: nowrap; }
  .result[aria-selected="true"] { background: var(--pine-deep); }
  .result[aria-selected="true"] .name { color: var(--ice-mint); }
  .result:hover { background: var(--pine-deep); }
  .beds--free { color: #6ee3b0; } .beds--restricted { color: #e8c563; } .beds--closed { color: #f2acab; }

  /* ── left rail: grouped, labeled, ≤4 per cluster ─────────────────────── */
  .rail { position: absolute; left: 14px; top: 74px; z-index: 4; display: flex; flex-direction: column; gap: 14px; width: 158px; }
  .cluster { background: rgba(10,20,15,.88); border-radius: var(--r-base); padding: 10px; }
  .cluster h2 { font: var(--label); letter-spacing: var(--label-track); text-transform: uppercase; color: var(--turquoise-muted); padding: 2px 4px 8px; }
  .cluster h2::after { content: ''; display: block; width: 14px; height: 2px; background: var(--gold); border-radius: 1px; margin-top: 5px; }
  .rail-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
    border-radius: var(--r-base); color: var(--paper); min-height: 40px;
    font: 500 .82rem/1 'Roboto Condensed', Roboto, sans-serif; letter-spacing: .05em;
    transition: background-color .2s ease;
  }
  .rail-btn:hover { background: rgba(157,217,210,.08); }
  .rail-btn[aria-pressed="true"] { background: var(--forest); }
  .rail-btn[aria-pressed="true"]:hover { background: var(--forest-deep); }
  .rail-btn[aria-pressed="true"] .count { color: var(--paper); }
  .rail-btn .icon { width: 20px; height: 20px; color: var(--ice-mint); }
  .rail-btn .count { margin-left: auto; font: var(--label); color: var(--turquoise-muted); font-variant-numeric: tabular-nums; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin: 6px 16px 6px 6px; }
  .dot--free { background: var(--signal); } .dot--restricted { background: var(--restricted); }
  .dot--closed { background: var(--closed); } .dot--unknown { background: #575757; }

  /* ── map controls ────────────────────────────────────────────────────── */
  .map-controls { position: absolute; right: 14px; top: 74px; z-index: 4; display: flex; flex-direction: column; gap: 6px; }
  .ctl {
    width: 44px; height: 44px; display: grid; place-items: center;
    background: rgba(10,20,15,.88); border-radius: var(--r-base); color: var(--paper);
    transition: background-color .2s ease;
  }
  .ctl:hover { background: var(--pine-ridge); }
  .ctl .icon { color: var(--ice-mint); }

  .hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4;
    background: rgba(10,20,15,.88); border-radius: var(--r-base); padding: 8px 14px;
    font: 500 .78rem/1 'Roboto Condensed', Roboto, sans-serif; letter-spacing: .08em; color: var(--ice-mint);
    text-shadow: 0 0 4px rgba(19,52,38,.7);
  }
  .hint .num { color: var(--gold); font-variant-numeric: tabular-nums; }

  /* ── mobile: rail collapses into a labeled bottom sheet trigger ───────── */
  .mobile-layers { display: none; }
  @media (max-width: 700px) {
    .rail, .hint { display: none; }
    .topbar { flex-wrap: wrap; }
    .search-wrap { order: 3; flex-basis: 100%; max-width: none; }
    .date-chip { margin-left: auto; }
    .mobile-layers {
      display: flex; align-items: center; gap: 10px; position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4;
      min-height: 48px; padding: 0 16px; background: rgba(10,20,15,.92); border-radius: var(--r-base);
      font: 500 .85rem/1 'Roboto Condensed', Roboto, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    }
    .mobile-layers .icon { color: var(--ice-mint); }
    .mobile-layers span { color: var(--turquoise-muted); margin-left: auto; font-size: .72rem; }
  }
</style>
</head>
<body>
  <div class="map" role="img" aria-label="Karte der Walliser Hütten">
    <div class="map-label">
      <span class="pin" aria-hidden="true"></span>
      <span><strong>Aarbiwak</strong> · <span class="beds">14 Betten frei</span></span>
    </div>
  </div>

  <header class="topbar">
    <div class="logo">
      <img src="assets/logo_banner_dark.png" alt="wodo.re">
    </div>

    <div class="search-wrap">
      <div class="search" role="search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="Hütte, Gipfel oder Ort suchen" value="aarb" aria-label="Ortssuche" autofocus>
        <kbd>/</kbd>
      </div>
      <div class="results" role="listbox" aria-label="Suchresultate">
        <button class="result" role="option" aria-selected="true">
          <span class="pin" style="background: var(--signal)"></span>
          <span><span class="name">Aarbiwak</span><br><span class="meta">2731 m · Vispertal, Wallis</span></span>
          <span class="beds beds--free">14 FREI</span>
        </button>
        <button class="result" role="option" aria-selected="false">
          <span class="pin" style="background: var(--restricted)"></span>
          <span><span class="name">Turtmannhütte</span><br><span class="meta">2519 m · Turtmanntal, Wallis</span></span>
          <span class="beds beds--restricted">3 FREI</span>
        </button>
        <button class="result" role="option" aria-selected="false">
          <span class="pin" style="background: var(--closed)"></span>
          <span><span class="name">Topalihütte</span><br><span class="meta">2674 m · Tal, Wallis</span></span>
          <span class="beds beds--closed">GESCHLOSSEN</span>
        </button>
      </div>
    </div>

    <button class="date-chip">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      FR, 26. SEP
    </button>
  </header>

  <nav class="rail" aria-label="Kartenfilter">
    <div class="cluster">
      <h2>Hütten</h2>
      <button class="rail-btn" aria-pressed="true"><span class="legend-dot dot--free" style="margin:0"></span>Bett frei<span class="count">126</span></button>
      <button class="rail-btn" aria-pressed="true"><span class="legend-dot dot--restricted" style="margin:0"></span>Eingeschränkt<span class="count">48</span></button>
      <button class="rail-btn" aria-pressed="false"><span class="legend-dot dot--closed" style="margin:0"></span>Geschlossen<span class="count">203</span></button>
      <button class="rail-btn" aria-pressed="false"><span class="legend-dot dot--unknown" style="margin:0"></span>Unbekannt<span class="count">31</span></button>
    </div>
    <div class="cluster">
      <h2>Aktivitäten</h2>
      <button class="rail-btn" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24"><path d="m12 2 6 9-6 11-6-11 6-9Z"/><path d="M6 11h12"/></svg>Skitour</button>
      <button class="rail-btn" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="m12 7v8l5 6M12 15l-5 6M8 10h8"/></svg>Wandern</button>
      <button class="rail-btn" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><path d="m4 20 4-2 4-9-3-3 2-3 3 2h3"/><circle cx="7" cy="6" r="2"/></svg>Klettern</button>
      <button class="rail-btn" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h6l3-8h4M9 9h5"/></svg>Bike</button>
    </div>
    <div class="cluster">
      <h2>Transport</h2>
      <button class="rail-btn" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M8 21l1-4M16 21l-1-4"/></svg>ÖV-Haltestelle</button>
    </div>
  </nav>

  <div class="map-controls" aria-label="Kartensteuerung">
    <button class="ctl" aria-label="Vergrössern"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ctl" aria-label="Verkleinern"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="ctl" aria-label="Standort"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="5"/></svg></button>
    <button class="ctl" aria-label="Basiskarte wechseln"><svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></button>
  </div>

  <p class="hint">KARTENANSICHT · <span class="num">408</span> HÜTTEN EINGEBLENDET</p>

  <button class="mobile-layers">
    <svg class="icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    Ebenen &amp; Filter
    <span>Hütten · Aktivitäten</span>
  </button>

<script>
  document.querySelectorAll('.rail-btn, .month').forEach(function (b) {
    b.addEventListener('click', function () {
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); document.querySelector('.search input').focus();
    }
  });
</script>
</body>
</html>
